kind = "mobile"
previewPath = "/"
title = "Mesada App"
version = "1.0.0"
id = "artifacts/mesada-app"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 25594

[services.development]
run = "pnpm --filter @workspace/mesada-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mesada-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mesada-app", "run", "serve" ]

[services.env]
PORT = "25594"
BASE_PATH = "/"
